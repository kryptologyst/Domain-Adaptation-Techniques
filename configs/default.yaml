# Default configuration for domain adaptation experiments

# Random seed for reproducibility
seed: 42

# Data configuration
data:
  root: "./data"
  input_channels: 1
  num_classes: 10
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15

# Model configuration
model:
  feature_dim: 128
  dropout: 0.5
  gradient_reversal_alpha: 1.0

# Training configuration
training:
  batch_size: 64
  num_epochs: 50
  learning_rate: 0.001
  weight_decay: 1e-4
  num_workers: 4

# Loss configuration
loss:
  classification_weight: 1.0
  adversarial_weight: 1.0
  coral_weight: 0.1
  mmd_weight: 0.0

# Experiment configuration
experiment:
  base_dir: "./experiments"
